<!-- Indique que le document utilise HTML5. -->
<!doctype html>
<!-- Définit le français comme langue principale de la page. -->
<html lang="fr">
<!-- Commence les informations invisibles de la page. -->
<head>
  <!-- Utilise les caractères accentués correctement. -->
  <meta charset="UTF-8">
  <!-- Rend la page responsive sur téléphone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Décrit une fiche iPhone générique avant que JavaScript ajoute le modèle. -->
  <meta name="description" content="Fiche produit iPhone neuf : capacité, prix et commande WhatsApp chez KING OFF 6J BUSINESS.">
  <!-- Titre provisoire, remplacé par produit.js avec le nom du modèle. -->
  <title>Fiche iPhone | KING OFF 6J BUSINESS</title>
  <!-- Charge l'icône de l'onglet. -->
  <link rel="icon" href="./public/images/ui/favicon.svg" type="image/svg+xml">
  <!-- Charge le CSS généré par Tailwind. -->
  <link rel="stylesheet" href="./src/output.css">
</head>
<!-- Indique à main.js que cette page est une fiche produit. -->
<body data-page="product">
  <!-- Zone remplie par le composant de navigation. -->
  <div id="site-header"></div>
  <!-- Contenu principal accessible de la page. -->
  <main id="product-page"></main>
  <!-- Zone remplie par le footer commun. -->
  <div id="site-footer"></div>
  <!-- Charge le JavaScript du site. -->
  <script type="module" src="./src/main.js"></script>
</body>
<!-- Ferme le document HTML. -->
</html>
