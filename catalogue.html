<!-- Indique que le document utilise HTML5. -->
<!doctype html>
<!-- Définit le français comme langue principale de la page. -->
<html lang="fr">
<!-- Commence les informations invisibles de la page. -->
<head>
  <!-- Utilise les caractères accentués correctement. -->
  <meta charset="UTF-8">
  <!-- Rend la page responsive sur téléphone. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Décrit cette page pour les moteurs de recherche. -->
  <meta name="description" content="Catalogue des iPhone neufs KING OFF 6J BUSINESS : modèles, capacités et prix en dollars.">
  <!-- Donne un titre clair à l'onglet. -->
  <title>Catalogue iPhone | KING OFF 6J BUSINESS</title>
  <!-- Charge l'icône de l'onglet. -->
  <link rel="icon" href="./public/images/ui/favicon.svg" type="image/svg+xml">
  <!-- Charge le CSS généré par Tailwind. -->
  <link rel="stylesheet" href="./src/output.css">
</head>
<!-- Indique à main.js que cette page est le catalogue. -->
<body data-page="catalogue">
  <!-- Zone remplie par le composant de navigation. -->
  <div id="site-header"></div>
  <!-- Contenu principal accessible de la page. -->
  <main>
    <!-- Introduit le catalogue. -->
    <section class="page-wrap py-10 sm:py-14">
      <!-- Petit repère de catégorie. -->
      <p class="section-kicker">Catalogue</p>
      <!-- Titre de la page. -->
      <h1 class="page-title">Tous les iPhone neufs.</h1>
      <!-- Texte qui explique les informations affichées. -->
      <p class="mt-3 max-w-2xl leading-7 text-slate-600">Filtrez par gamme ou capacité. Les détails complémentaires, les couleurs et la disponibilité sont confirmés dans WhatsApp.</p>
      <!-- Les filtres seront ajoutés ici par catalogue.js. -->
      <div id="catalogue-filters" class="mt-8"></div>
      <!-- Ligne qui montre le nombre de produits visibles. -->
      <div class="mt-8 flex items-center justify-between gap-4">
        <!-- Ce texte sera mis à jour par catalogue.js. -->
        <p id="catalogue-count" class="text-sm font-bold text-slate-500"></p>
        <!-- Lien direct pour demander un modèle absent. -->
        <a href="https://wa.me/243982993661" target="_blank" rel="noopener noreferrer" class="text-sm font-bold text-electric hover:underline">Modèle absent ? Écrivez-nous</a>
      </div>
      <!-- La grille de produits sera ajoutée ici par catalogue.js. -->
      <div id="catalogue-products" class="mt-5 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>
  <!-- Zone remplie par le footer commun. -->
  <div id="site-footer"></div>
  <!-- Charge le JavaScript du site. -->
  <script type="module" src="./src/main.js"></script>
</body>
<!-- Ferme le document HTML. -->
</html>
